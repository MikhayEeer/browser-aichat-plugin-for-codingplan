<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Float Chat - 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      padding: 40px;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #333;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e5e5e5;
    }

    .status {
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    .templates {
      margin-top: 24px;
    }

    .templates h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .template-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .template-btn {
      padding: 8px 14px;
      background: #f5f7fa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .template-btn:hover {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Float Chat 设置</h1>
    <p class="subtitle">配置你的 AI API，支持任意兼容 OpenAI 格式的服务</p>

    <div class="card">
      <div class="card-title">API 配置</div>

      <div class="form-group">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
        <p class="hint">API 服务地址，如: https://api.openai.com/v1</p>
      </div>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
        <p class="hint">你的 API 密钥，本地存储，不会上传</p>
      </div>

      <div class="form-group">
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="gpt-4o-mini">
        <p class="hint">模型名称，如: gpt-4o, gpt-4o-mini, claude-3-sonnet 等</p>
      </div>

      <div class="form-group">
        <label for="maxTokens">Max Tokens</label>
        <input type="text" id="maxTokens" placeholder="2048" value="2048">
        <p class="hint">最大输出 token 数</p>
      </div>

      <div class="templates">
        <h3>快速填充常用服务</h3>
        <div class="template-list">
          <button class="template-btn" data-base="https://api.openai.com/v1" data-model="gpt-4o-mini">OpenAI</button>
          <button class="template-btn" data-base="https://api.anthropic.com/v1" data-model="claude-3-sonnet">Anthropic</button>
          <button class="template-btn" data-base="https://api.deepseek.com/v1" data-model="deepseek-chat">DeepSeek</button>
          <button class="template-btn" data-base="https://openrouter.ai/api/v1" data-model="auto">OpenRouter</button>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="saveBtn">保存设置</button>
        <button class="btn btn-secondary" id="testBtn">测试连接</button>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script src="js/options.js"></script>
</body>
</html>
