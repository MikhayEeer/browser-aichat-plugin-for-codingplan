<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>miniQuestion - 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      padding: 40px;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #333;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e5e5e5;
    }

    .status {
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    .templates {
      margin-top: 24px;
    }

    .templates h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .template-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .template-btn {
      padding: 8px 14px;
      background: #f5f7fa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .template-btn:hover {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }

    /* 主题选择 */
    .theme-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .theme-option {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-option:hover {
      transform: scale(1.05);
    }

    .theme-option.active {
      border-color: #333;
    }

    .theme-option .check {
      display: none;
      color: white;
      font-size: 20px;
    }

    .theme-option.active .check {
      display: block;
    }

    .theme-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .theme-blue { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); }
    .theme-green { background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%); }
    .theme-orange { background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%); }
    .theme-red { background: linear-gradient(135deg, #F44336 0%, #D32F2F 100%); }
    .theme-pink { background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%); }

    /* 图标选择 */
    .icon-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .icon-option {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #e0e0e0;
      background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    .icon-option:hover {
      transform: scale(1.1);
    }

    .icon-option.active {
      border-color: #333;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
    }

    .icon-option svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .icon-option img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .icon-upload-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px dashed #ccc;
      background: #f5f7fa;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-upload-btn:hover {
      border-color: #667eea;
      background: #eee;
    }

    .icon-upload-btn svg {
      width: 20px;
      height: 20px;
      fill: #888;
    }

    #iconUpload {
      display: none;
    }

    /* 自定义图标预览 */
    .custom-icon-preview {
      margin-top: 12px;
      padding: 12px;
      background: #f5f7fa;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 12px;
    }

    .custom-icon-preview.show {
      display: flex;
    }

    .custom-icon-preview img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .custom-icon-preview span {
      font-size: 13px;
      color: #666;
    }

    .custom-icon-preview button {
      margin-left: auto;
      background: none;
      border: none;
      color: #dc3545;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>miniQuestion 设置</h1>
    <p class="subtitle">配置你的 AI API，支持任意兼容 OpenAI 格式的服务</p>

    <div class="card">
      <div class="card-title">API 配置</div>

      <div class="form-group">
        <label for="apiType">API 类型</label>
        <select id="apiType">
          <option value="openai">OpenAI 兼容</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
        <p class="hint">OpenAI 兼容格式支持 OpenAI、DeepSeek、OpenRouter、本地模型等</p>
      </div>

      <div class="form-group">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
        <p class="hint">API 服务地址，如: https://api.openai.com/v1</p>
      </div>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
        <p class="hint">你的 API 密钥，本地存储，不会上传</p>
      </div>

      <div class="form-group">
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="gpt-4o-mini">
        <p class="hint">模型名称，如: gpt-4o, gpt-4o-mini, claude-3-sonnet 等</p>
      </div>

      <div class="form-group">
        <label for="maxTokens">Max Tokens</label>
        <input type="text" id="maxTokens" placeholder="2048" value="2048">
        <p class="hint">最大输出 token 数</p>
      </div>

      <div class="templates">
        <h3>快速填充常用服务</h3>
        <div class="template-list">
          <button class="template-btn" data-type="openai" data-base="https://api.openai.com/v1" data-model="gpt-4o-mini">OpenAI</button>
          <button class="template-btn" data-type="anthropic" data-base="https://api.anthropic.com" data-model="claude-sonnet-4-20250514">Anthropic</button>
          <button class="template-btn" data-type="openai" data-base="https://api.deepseek.com/v1" data-model="deepseek-chat">DeepSeek</button>
          <button class="template-btn" data-type="openai" data-base="https://openrouter.ai/api/v1" data-model="auto">OpenRouter</button>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="saveBtn">保存设置</button>
        <button class="btn btn-secondary" id="testBtn">测试连接</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <div class="card-title">外观设置</div>

      <div class="form-group">
        <label>主题配色</label>
        <div class="theme-options">
          <div class="theme-option theme-purple" data-theme="purple">
            <span class="check">✓</span>
          </div>
          <div class="theme-option theme-blue active" data-theme="blue">
            <span class="check">✓</span>
          </div>
          <div class="theme-option theme-green" data-theme="green">
            <span class="check">✓</span>
          </div>
          <div class="theme-option theme-orange" data-theme="orange">
            <span class="check">✓</span>
          </div>
          <div class="theme-option theme-red" data-theme="red">
            <span class="check">✓</span>
          </div>
          <div class="theme-option theme-pink" data-theme="pink">
            <span class="check">✓</span>
          </div>
        </div>
        <p class="hint">选择你喜欢的主题颜色</p>
      </div>

      <div class="form-group">
        <label>悬浮球图标</label>
        <div class="icon-options">
          <div class="icon-option active" data-icon="globe">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </div>
          <div class="icon-option" data-icon="chat">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
          </div>
          <div class="icon-option" data-icon="robot">
            <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7h1a1 1 0 011 1v3a1 1 0 01-1 1h-1v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1H2a1 1 0 01-1-1v-3a1 1 0 011-1h1a7 7 0 017-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 012-2M7.5 13A2.5 2.5 0 005 15.5 2.5 2.5 0 007.5 18a2.5 2.5 0 002.5-2.5A2.5 2.5 0 007.5 13m9 0a2.5 2.5 0 00-2.5 2.5 2.5 2.5 0 002.5 2.5 2.5 2.5 0 002.5-2.5 2.5 2.5 0 00-2.5-2.5z"/></svg>
          </div>
          <div class="icon-option" data-icon="star">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          </div>
          <div class="icon-option" data-icon="bolt">
            <svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/></svg>
          </div>
          <label class="icon-upload-btn" id="uploadBtn" title="上传自定义图标">
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            <input type="file" id="iconUpload" accept="image/*">
          </label>
        </div>
        <div class="custom-icon-preview" id="customIconPreview">
          <img id="customIconImg" src="" alt="自定义图标">
          <span id="customIconName"></span>
          <button id="removeCustomIcon">移除</button>
        </div>
        <p class="hint">选择预设图标或上传自定义图片（建议 48x48 像素）</p>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="saveAppearanceBtn">保存外观</button>
      </div>
    </div>
  </div>

  <script src="js/options.js"></script>
</body>
</html>
