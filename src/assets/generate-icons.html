<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { border: 1px solid #ddd; margin: 10px; }
    a { display: inline-block; margin: 10px; padding: 10px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>Click the buttons to download icons:</p>
  <canvas id="c16" width="16" height="16"></canvas>
  <canvas id="c48" width="48" height="48"></canvas>
  <canvas id="c128" width="128" height="128"></canvas>
  <br>
  <a id="d16" download="icon16.png">Download 16x16</a>
  <a id="d48" download="icon48.png">Download 48x48</a>
  <a id="d128" download="icon128.png">Download 128x128</a>

  <script>
    function drawIcon(ctx, size) {
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#667eea');
      grad.addColorStop(1, '#764ba2');

      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2 - 1, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('AI', size/2, size/2 + size * 0.05);
    }

    [16, 48, 128].forEach(size => {
      const canvas = document.getElementById('c' + size);
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, size);
      document.getElementById('d' + size).href = canvas.toDataURL('image/png');
    });
  </script>
</body>
</html>
